- id: session-title-llm
  name: '@deepseek-ai/dsh-session-title-first-prompt-llm'
  disabled: true
- id: web
  name: '@deepseek-ai/dsh-web'
  config:
    searchProvider: exa
- id: web-search-deepseek
  name: '@deepseek-ai/dsh-web-search-deepseek'
  disabled: true
- id: llm-deepseek
  name: '@deepseek-ai/dsh-llm-deepseek'
  disabled: true
# Agent Teams replaces the legacy continuable-child control surface for
# Shiro-native multi-agent collaboration. Ordinary subagent/subagent_fork stay
# available as one-shot delegation, while durable peer mail and shared tasks
# live in the Team domain below.
- id: tool-subagent-control
  name: '@deepseek-ai/dsh-tool-subagent-control'
  disabled: true
- id: tool-subagent-report
  name: '@deepseek-ai/dsh-tool-subagent-report'
  disabled: true
- id: tool-subagent
  name: '@deepseek-ai/dsh-tool-subagent'
  config:
    provider: spawn
    toolName: subagent
    backgroundMode: one-shot
    maxDepth: 1
- id: tool-subagent-fork
  name: '@deepseek-ai/dsh-tool-subagent'
  config:
    provider: fork
    toolName: subagent_fork
    backgroundMode: one-shot
    maxDepth: 1
- insert:
    # Native Shiro peer-to-peer coordination. `send_message` is quiet/durable
    # (it does not spend a model turn just to receive information), while
    # `followup_task` explicitly wakes a teammate when new reasoning is needed.
    - id: agent-team
      name: '@deepseek-ai/dsh-experimental-agent-team'
      config:
        maxMembers: 8
        maxTasks: 256
        maxPendingMessagesPerMember: 64
        maxMessageBytes: 65536
        disposalTimeoutMs: 5000
    - id: tool-agent-team
      name: '@deepseek-ai/dsh-experimental-tool-agent-team'
      config:
        freshProvider: spawn
        forkProvider: fork
    - id: web-search-exa-keyless
      name: '@deepseek-ai/dsh-web-search-exa'
      config:
        mcpURL: https://mcp.exa.ai/mcp
    # First-party anonymous HTTP fetch provider backing the web_fetch tool
    # (enabled per-preset via tool-web `fetch: true`). Hardened upstream:
    # http(s) only, credential-URL rejection, same-origin redirects, byte
    # and char caps, product User-Agent.
    - id: web-fetch-http
      name: '@deepseek-ai/dsh-web-fetch-http'
    # To connect an external MCP server, copy this row into
    # E:\Project\.ShiroRuntime\dsh-home\profiles\web\cordis.patch.yml
    # (one instance per server; tools appear as mcp__<serverName>__<tool>):
    # - id: mcp-github
    #   name: '@deepseek-ai/dsh-mcp-client'
    #   config:
    #     serverName: github
    #     transport: stdio
    #     command: npx
    #     args: ['-y', '@modelcontextprotocol/server-github']
    # Session-local reminders for the agent (schedule_create/list/delete).
    # NOTE: delivery is fixed session-local -- a reminder fires inside the
    # session that created it, while that session is live. This is NOT
    # project-level cron; recurring project automation remains the fleet.
    - id: schedule
      name: '@deepseek-ai/dsh-schedule'
    # Shiro's own engine-facing tools. They live HERE, in Shiro's bundle patch,
    # rather than inside the engine's shipped agent presets: those presets are
    # the engine's, and a preset of the engine's referencing a Shiro package
    # inverts the layering -- which is exactly what verify-runtime-closure was
    # reporting. Mounted at profile level they register into the GLOBAL tool
    # layer, which every agent scope inherits, so agents keep them.
    - id: shiro-container-tool
      name: '@shiro-ai/harness-bridge/container-tool'
      config:
        workspaceRoot: !!js process.env.SHIRO_WORKSPACE_ROOT
    # Terminal fast-path: when the model has already computed the exact final
    # answer, this tool commits that text and closes the turn without paying for
    # a second Web inference round just to echo the tool result.
    - id: shiro-finish-tool
      name: '@shiro-ai/harness-bridge/finish-tool'
    - id: shiro-git-tool
      name: '@shiro-ai/harness-bridge/git-tool'
      config:
        workspaceRoot: !!js process.env.SHIRO_WORKSPACE_ROOT
    # Read-only host inspection for the agent loop (same actions as the
    # connector: host_system_info, host_process_list). Never sends signals.
    - id: shiro-host-tool
      name: '@shiro-ai/harness-bridge/host-tool'
    # Bounded PDF/DOCX/XLSX extractors. Paths follow the session cwd.
    - id: shiro-document-tool
      name: '@shiro-ai/harness-bridge/document-tool'
      config:
        workspaceRoot: !!js process.env.SHIRO_WORKSPACE_ROOT
    - id: llm-shiro-harness-bridge
      name: '@shiro-ai/harness-bridge'
      config:
        # Legacy ChatGPT-Web relay route. Kept registered for compatibility and
        # for an explicit harness_start execution_mode=relay.
        provider: shiro-sol
        model: gpt-5.6-sol
        # Native loop-owner route. When both values are set, autonomous becomes
        # the inferred default and DSH feeds streamed model output/tool results
        # directly through its local ReactLoopAgent without returning to Web.
        autonomousProvider: !!js process.env.SHIRO_AUTONOMOUS_PROVIDER ?? ''
        autonomousModel: !!js process.env.SHIRO_AUTONOMOUS_MODEL ?? ''
        # Optional explicit override: autonomous | relay. Empty means infer from
        # whether the autonomous provider/model pair above is configured.
        executionMode: !!js process.env.SHIRO_EXECUTION_MODE ?? ''
        workspaceRoot: !!js process.env.SHIRO_WORKSPACE_ROOT
        # Extra directory trees workspace_open may address, colon-separated.
        # Empty (the default) keeps every direct action locked to workspaceRoot.
        workspaceAllowlist: !!js process.env.SHIRO_WORKSPACE_ALLOWLIST ?? ''
        # Coarse permission dial: read-only | workspace-write | full. This is a
        # CEILING -- permission_set may narrow it at runtime, never widen it.
        permissionProfile: !!js process.env.SHIRO_PERMISSION_PROFILE ?? 'full'
        # Destructive actions run without a separate confirm=true round trip.
        # Set SHIRO_REQUIRE_CONFIRMATIONS=1 to put that brake back.
        requireConfirmations: !!js process.env.SHIRO_REQUIRE_CONFIRMATIONS === '1'
        permissionRules:
          commandAllow: !!js process.env.SHIRO_COMMAND_ALLOW ?? ''
          commandDeny: !!js process.env.SHIRO_COMMAND_DENY ?? ''
          networkAllow: !!js process.env.SHIRO_NETWORK_ALLOW ?? ''
          networkDeny: !!js process.env.SHIRO_NETWORK_DENY ?? ''
        token: !!js process.env.SHIRO_BRIDGE_TOKEN
        port: !!js Number(process.env.SHIRO_BRIDGE_PORT ?? 23157)
        waitMs: 25000
        maxConcurrentTurns: 4
        relayUrl: !!js process.env.SHIRO_RELAY_URL
        relayToken: !!js process.env.SHIRO_RELAY_API_TOKEN
        relayModel: !!js process.env.SHIRO_RELAY_MODEL ?? 'GPT-5.6 Sol'
        # Dedicated autonomous provider that always consumes ChatGPT Web through
        # the browser relay instead of handing model requests back to MCP.
        webProvider: !!js process.env.SHIRO_WEB_PROVIDER ?? 'shiro-web'
        webModel: !!js process.env.SHIRO_WEB_MODEL ?? 'gpt-5.6-sol'
        webRelayModel: !!js process.env.SHIRO_WEB_RELAY_MODEL ?? 'GPT-5.6 Sol'
        fleetStateDir: !!js process.env.SHIRO_FLEET_STATE_DIR ?? ''
        # Service logs live beside the project root, not inside it; logs_tail
        # reads them through a fixed stream allowlist.
        logDir: !!js process.env.SHIRO_LOG_DIR ?? ''
        # Separate from the MCP bearer token. The secure tunnel never receives
        # this credential; only marked local OmniCast clients can manage the
        # persisted return-only lease.
        omnicastControlToken: !!js process.env.SHIRO_OMNICAST_CONTROL_TOKEN ?? ''
        omnicastReturnStateFile: !!js process.env.SHIRO_OMNICAST_RETURN_STATE_FILE ?? ''
        codexCliPath: !!js process.env.SHIRO_CODEX_CLI ?? ''
        grokCliPath: !!js process.env.SHIRO_GROK_CLI ?? ''
