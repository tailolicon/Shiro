- id: session-title-llm
  name: '@deepseek-ai/dsh-session-title-first-prompt-llm'
  disabled: true
- id: web
  name: '@deepseek-ai/dsh-web'
  config:
    searchProvider: exa
- id: web-search-deepseek
  name: '@deepseek-ai/dsh-web-search-deepseek'
  disabled: true
- id: llm-deepseek
  name: '@deepseek-ai/dsh-llm-deepseek'
  disabled: true
- insert:
    - id: web-search-exa-keyless
      name: '@deepseek-ai/dsh-web-search-exa'
      config:
        mcpURL: https://mcp.exa.ai/mcp
    - id: llm-shiro-harness-bridge
      name: '@shiro-ai/harness-bridge'
      config:
        provider: shiro-sol
        model: gpt-5.6-sol
        workspaceRoot: !!js process.env.SHIRO_WORKSPACE_ROOT
        token: !!js process.env.SHIRO_BRIDGE_TOKEN
        port: !!js Number(process.env.SHIRO_BRIDGE_PORT ?? 23157)
        waitMs: 25000
        relayUrl: !!js process.env.SHIRO_RELAY_URL
        relayToken: !!js process.env.SHIRO_RELAY_API_TOKEN
        relayModel: !!js process.env.SHIRO_RELAY_MODEL ?? 'GPT-5.6 Sol'
